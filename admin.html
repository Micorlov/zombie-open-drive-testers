<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tester list: Zombie Open Drive</title>
<link rel="stylesheet" href="style.css">
<style>
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .row .em { flex: 1 1 220px; word-break: break-all; font-weight: 600; }
  .row .when { color: var(--muted); font-size: 14px; }
  .row label { font-weight: 400; display: flex; align-items: center; gap: 6px; }
  .bar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin: 16px 0; }
  .btn-row { display: flex; gap: 12px; flex-wrap: wrap; }
</style>
</head>
<body>
<main>
  <h1>Tester <span>list</span></h1>
  <p id="status" class="muted" role="status" aria-live="polite">Sign in with your Google account.</p>
  <div class="btn-row">
    <button id="in">Sign in with Google</button>
    <button id="out" class="ghost" hidden>Sign out</button>
  </div>

  <section id="panel" hidden>
    <div class="bar">
      <strong id="count"></strong>
      <button id="copy">Copy all emails</button>
    </div>
    <p class="muted">Paste the copied list into Play Console: Testing, Closed testing, Alpha, Testers, the list "Zombie Open Drive testers". Tick "added" once you have done it.</p>
    <div id="list"></div>
  </section>
</main>

<script type="module">
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js';
import { collection, query, orderBy, onSnapshot, doc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
import { app, db } from './firebase.js';
import { ADMIN_EMAIL, GOAL } from './common.js';

const $ = (id) => document.getElementById(id);
const auth = getAuth(app);
let unsub = null;
let emails = [];

function status(text) { $('status').textContent = text; }

$('in').onclick = () => signInWithPopup(auth, new GoogleAuthProvider()).catch((e) => status('Sign-in failed: ' + e.code));
$('out').onclick = () => signOut(auth);

$('copy').onclick = async () => {
  try {
    await navigator.clipboard.writeText(emails.join(','));
    $('copy').textContent = `Copied ${emails.length}`;
  } catch {
    $('copy').textContent = 'Copy blocked: select the emails by hand';
  }
  setTimeout(() => { $('copy').textContent = 'Copy all emails'; }, 2000);
};

function render(rows) {
  emails = rows.map((r) => r.id);
  const done = rows.filter((r) => r.added).length;
  $('count').textContent = `${rows.length} / ${GOAL} signed up, ${done} added in Play Console`;
  const list = $('list');
  list.replaceChildren(...rows.map((r) => {
    const row = document.createElement('div'); row.className = 'row';
    const em = document.createElement('span'); em.className = 'em'; em.textContent = r.id;
    const when = document.createElement('span'); when.className = 'when';
    when.textContent = r.createdAt ? r.createdAt.toDate().toLocaleString() : '';
    const lab = document.createElement('label');
    const box = document.createElement('input'); box.type = 'checkbox'; box.checked = !!r.added;
    box.onchange = () => updateDoc(doc(db, 'testers', r.id), { added: box.checked }).catch((e) => status('Update failed: ' + e.code));
    lab.append(box, 'added');
    const del = document.createElement('button'); del.className = 'ghost'; del.textContent = 'Delete';
    let armed = false;
    del.onclick = () => {
      if (!armed) { armed = true; del.textContent = 'Sure?'; setTimeout(() => { armed = false; del.textContent = 'Delete'; }, 3000); return; }
      deleteDoc(doc(db, 'testers', r.id)).catch((e) => status('Delete failed: ' + e.code));
    };
    row.append(em, when, lab, del);
    return row;
  }));
}

onAuthStateChanged(auth, (user) => {
  if (unsub) { unsub(); unsub = null; }
  const ok = user && user.email === ADMIN_EMAIL;
  $('panel').hidden = !ok;
  $('in').hidden = !!user;
  $('out').hidden = !user;
  if (!user) return status('Sign in with your Google account.');
  if (!ok) { status(`Not authorized: ${user.email}. Sign out and use ${ADMIN_EMAIL}.`); return; }
  status(`Signed in as ${user.email}`);
  unsub = onSnapshot(
    query(collection(db, 'testers'), orderBy('createdAt')),
    (snap) => render(snap.docs.map((d) => ({ id: d.id, ...d.data() }))),
    (e) => status('Could not read the list: ' + e.code),
  );
});
</script>
</body>
</html>
